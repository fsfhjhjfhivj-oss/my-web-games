<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>أذكار الصباح والمساء</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#233229;
    --ink-soft:#4b5a4f;
    --gold:#c39a4d;
    --gold-soft:#dcc190;
    --cream:#faf6ec;
  }
  body.mode-evening{
    --ink:#f3ede0;
    --ink-soft:#c9bfa8;
    --gold:#d8ae5f;
    --gold-soft:#8a6f3c;
    --cream:#241d2e;
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    transition: background 1.4s ease, color .6s ease;
  }
  .amiri{ font-family:'Amiri', serif; }

  .sky{
    position:fixed; inset:0; z-index:-2;
    background: radial-gradient(ellipse 140% 90% at 50% 120%, var(--s1) 0%, var(--s2) 45%, var(--s3) 100%);
    transition: background 1.6s ease;
  }
  .stars{
    position:fixed; inset:0; z-index:-1;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 20%, rgba(255,255,255,.55), transparent),
      radial-gradient(1.5px 1.5px at 70% 15%, rgba(255,255,255,.45), transparent),
      radial-gradient(1px 1px at 40% 35%, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 85% 45%, rgba(255,255,255,.35), transparent),
      radial-gradient(1px 1px at 10% 55%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 55% 8%, rgba(255,255,255,.45), transparent),
      radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,.3), transparent),
      radial-gradient(1.5px 1.5px at 90% 65%, rgba(255,255,255,.3), transparent);
    background-repeat: no-repeat;
    opacity: var(--stars-op, 1);
    transition: opacity 1.6s ease;
    pointer-events:none;
  }

  .card{
    background: rgba(250,246,236,0.9);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(195,154,77,0.25);
    transition: background .6s ease, border-color .6s ease;
  }
  body.mode-evening .card{
    background: rgba(36,29,46,0.82);
    border-color: rgba(216,174,95,0.22);
  }

  .dhikr-text{ line-height: 2.35; letter-spacing: 0.01em; }

  .counter-ring{ transition: box-shadow .35s ease, background .35s ease, color .35s ease, transform .18s ease; }
  .counter-ring:active{ transform: scale(0.94); }
  .counter-ring.done{
    background: var(--gold);
    color: var(--cream);
    box-shadow: 0 0 0 6px rgba(195,154,77,0.18);
  }

  .progress-dot{
    width:7px; height:7px; border-radius:999px;
    background: rgba(195,154,77,0.28);
    transition: background .3s ease, width .3s ease;
  }
  .progress-dot.active{ background: var(--gold); width:18px; border-radius:999px; }
  .progress-dot.filled{ background: var(--gold-soft); }

  .fade-slide{ animation: fadeSlide .5s ease; }
  @keyframes fadeSlide{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .nav-btn{ transition: background .2s ease, opacity .2s ease; }
  .nav-btn:disabled{ opacity:.3; }

  ::selection{ background: var(--gold-soft); }

  @media (prefers-reduced-motion: reduce){
    .fade-slide{ animation:none; }
    *{ transition-duration: .01ms !important; }
  }

  .checkmark{ animation: pop .35s ease; }
  @keyframes pop{
    0%{ transform: scale(0.4); opacity:0; }
    60%{ transform: scale(1.15); opacity:1; }
    100%{ transform: scale(1); }
  }

  /* Morning / evening switch */
  .switch{
    display:flex; gap:4px; padding:4px;
    background: rgba(195,154,77,0.1);
    border-radius:999px;
  }
  body.mode-evening .switch{ background: rgba(216,174,95,0.1); }
  .switch button{
    padding:7px 18px; border-radius:999px; font-size:13px; font-weight:600;
    color: var(--ink-soft);
    transition: background .3s ease, color .3s ease;
  }
  .switch button.active{
    background: var(--gold);
    color: var(--cream);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8 md:py-12">

<div class="sky" id="sky"></div>
<div class="stars" id="stars"></div>

<div class="w-full max-w-xl mx-auto">

  <!-- Header -->
  <header class="text-center mb-6 fade-slide">
    <p class="text-[13px] tracking-wide text-[var(--ink-soft)] mb-1" id="verseLabel"></p>
    <h1 class="amiri text-3xl md:text-4xl font-bold text-[var(--ink)] mb-4" id="title"></h1>
    <div class="switch inline-flex" id="switch">
      <button data-mode="morning">الصباح</button>
      <button data-mode="evening">المساء</button>
    </div>
  </header>

  <!-- Overall progress -->
  <div class="flex items-center justify-center gap-2 mb-6" id="dots"></div>

  <!-- Main card -->
  <main class="card rounded-[28px] shadow-[0_20px_60px_-25px_rgba(35,50,41,0.35)] px-6 py-8 md:px-10 md:py-11 relative" id="card">

    <div id="cardInner" class="fade-slide">
      <div class="flex items-center justify-between mb-5">
        <span class="text-xs font-medium px-3 py-1 rounded-full bg-[var(--gold)]/10 text-[var(--gold)]" id="refLabel"></span>
        <span class="text-xs text-[var(--ink-soft)]" id="counterLabel"></span>
      </div>

      <p class="amiri dhikr-text text-[22px] md:text-[26px] text-center text-[var(--ink)] mb-8" id="dhikrText"></p>

      <div class="flex flex-col items-center gap-4">
        <button id="tapBtn" class="counter-ring w-24 h-24 md:w-28 md:h-28 rounded-full border-2 border-[var(--gold)] flex items-center justify-center text-[var(--gold)] select-none">
          <span id="tapContent" class="amiri text-3xl md:text-4xl font-bold"></span>
        </button>
        <p class="text-xs text-[var(--ink-soft)]" id="hint">اضغط للعدّ</p>
      </div>
    </div>

    <!-- Navigation -->
    <div class="flex items-center justify-between mt-9">
      <button id="prevBtn" class="nav-btn text-sm font-medium px-4 py-2 rounded-full hover:bg-[var(--gold)]/10 text-[var(--ink)]">
        السابق ‹
      </button>
      <button id="resetBtn" class="text-xs text-[var(--ink-soft)] hover:text-[var(--gold)] transition-colors">
        إعادة الضبط
      </button>
      <button id="nextBtn" class="nav-btn text-sm font-medium px-4 py-2 rounded-full hover:bg-[var(--gold)]/10 text-[var(--ink)]">
        › التالي
      </button>
    </div>
  </main>

  <!-- Completion message -->
  <div id="doneMsg" class="hidden text-center mt-8 fade-slide">
    <p class="amiri text-2xl text-[var(--ink)] mb-1">تقبّل الله منك</p>
    <p class="text-sm text-[var(--ink-soft)]" id="doneSub"></p>
  </div>

  <footer class="text-center mt-8 text-[11px] text-[var(--ink-soft)]/70" id="footerLine"></footer>
</div>

      { ref: "الرضا بالله رباً", count: 3, text: "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِمُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ نَبِيًّا" },
      { ref: "دعاء العافية", count: 1, text: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ، اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي" },
      { ref: "حسبي الله", count: 7, text: "حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ، عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ" },
      { ref: "التعوذ بكلمات الله التامة", count: 3, text: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ" },
      { ref: "التسبيح والتحميد", count: 100, text: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ" },
      { ref: "التهليل", count: 10, text: "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ" },
      { ref: "الصلاة على النبي ﷺ", count: 10, text: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ" }
    ]
  }
};

let mode = 'morning';
let current = 0;
let state = data[mode].azkar.map(a => ({ remaining: a.count }));

const body = document.body;
const switchEl = document.getElementById('switch');
const titleEl = document.getElementById('title');
const verseEl = document.getElementById('verseLabel');
const footerEl = document.getElementById('footerLine');
const doneSubEl = document.getElementById('doneSub');
const dotsEl = document.getElementById('dots');
const refLabel = document.getElementById('refLabel');
const counterLabel = document.getElementById('counterLabel');
const dhikrText = document.getElementById('dhikrText');
const tapBtn = document.getElementById('tapBtn');
const tapContent = document.getElementById('tapContent');
const hint = document.getElementById('hint');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const cardInner = document.getElementById('cardInner');
const doneMsg = document.getElementById('doneMsg');

function lerp(a,b,t){ return Math.round(a + (b-a)*t); }
function hexLerp(hexA, hexB, t){
  const a = hexA.match(/\w\w/g).map(x=>parseInt(x,16));
  const b = hexB.match(/\w\w/g).map(x=>parseInt(x,16));
  const c = a.map((v,i)=>lerp(v,b[i],t));
  return '#' + c.map(v=>v.toString(16).padStart(2,'0')).join('');
}

function buildDots(){
  dotsEl.innerHTML = '';
  data[mode].azkar.forEach(() => {
    const d = document.createElement('span');
    d.className = 'progress-dot';
    dotsEl.appendChild(d);
  });
}

function updateSky(){
  const d = data[mode];
  const completed = state.filter(s => s.remaining <= 0).length;
  const t = completed / d.azkar.length;
  document.documentElement.style.setProperty('--s1', hexLerp(d.skyStart.s1, d.skyEnd.s1, t));
  document.documentElement.style.setProperty('--s2', hexLerp(d.skyStart.s2, d.skyEnd.s2, t));
  document.documentElement.style.setProperty('--s3', hexLerp(d.skyStart.s3, d.skyEnd.s3, t));
  const starsOp = d.starsOpStart + (d.starsOpEnd - d.starsOpStart) * t;
  document.documentElement.style.setProperty('--stars-op', String(starsOp));
}

function updateDots(){
  [...dotsEl.children].forEach((d, i) => {
    d.classList.remove('active','filled');
    if (i === current) d.classList.add('active');
    else if (state[i].remaining <= 0) d.classList.add('filled');
  });
}

function render(){
  const d = data[mode];
  const a = d.azkar[current];
  const s = state[current];
  const isDone = s.remaining <= 0;

  refLabel.textContent = a.ref;
  dhikrText.textContent = a.text;
  counterLabel.textContent = `${current+1} / ${d.azkar.length}`;

  tapBtn.classList.toggle('done', isDone);
  if (isDone){
    tapContent.innerHTML = '<span class="checkmark">✓</span>';
    hint.textContent = 'اكتمل، بارك الله فيك';
  } else {
    tapContent.textContent = s.remaining;
    hint.textContent = a.count === 1 ? 'اضغط لإتمامه' : 'اضغط للعدّ';
  }

  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === d.azkar.length - 1;

  cardInner.classList.remove('fade-slide');
  void cardInner.offsetWidth;
  cardInner.classList.add('fade-slide');

  updateDots();
  updateSky();

  const allDone = state.every(s => s.remaining <= 0);
  doneMsg.classList.toggle('hidden', !allDone);
}

function applyMode(){
  const d = data[mode];
  body.classList.toggle('mode-evening', mode === 'evening');
  titleEl.textContent = d.title;
  verseEl.textContent = d.verse;
  footerEl.textContent = d.footer;
  doneSubEl.textContent = d.doneSub;
  [...switchEl.children].forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
  buildDots();
  render();
}

function switchMode(newMode){
  if (newMode === mode) return;
  mode = newMode;
  current = 0;
  state = data[mode].azkar.map(a => ({ remaining: a.count }));
  applyMode();
}

switchEl.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-mode]');
  if (btn) switchMode(btn.dataset.mode);
});

tapBtn.addEventListener('click', () => {
  const d = data[mode];
  const s = state[current];
  if (s.remaining > 0){
    s.remaining -= 1;
    render();
    if (s.remaining <= 0 && current < d.azkar.length - 1){
      setTimeout(() => { current += 1; render(); }, 550);
    }
  }
});

prevBtn.addEventListener('click', () => { if (current > 0){ current -= 1; render(); } });
nextBtn.addEventListener('click', () => { if (current < data[mode].azkar.length - 1){ current += 1; render(); } });
resetBtn.addEventListener('click', () => { state[current].remaining = data[mode].azkar[current].count; render(); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && !nextBtn.disabled) { current += 1; render(); }
  if (e.key === 'ArrowRight' && !prevBtn.disabled) { current -= 1; render(); }
  if (e.key === ' ') { e.preventDefault(); tapBtn.click(); }
});

applyMode();
</script>
</body>
</html>
